<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sales Dashboard</h1>
    <div>
      <input type="date" id="report-date-picker">
      <button id="refresh-btn">Refresh</button>
    </div>
  </header>

  <div id="error-banner" class="hidden"></div>
  <div id="loading-state">Loading data...</div>

  <main id="dashboard-content" class="hidden">
    <div class="kpi-grid">
      <div class="kpi"><div>Today Revenue</div><div id="val-today-rev">-</div></div>
      <div class="kpi"><div>Today Orders</div><div id="val-today-ord">-</div></div>
      <div class="kpi"><div>MTD Revenue</div><div id="val-mtd-rev">-</div></div>
      <div class="kpi"><div>Top Performer</div><div id="val-top-perf">-</div></div>
    </div>

    <div class="charts">
      <div><canvas id="chart-daily"></canvas></div>
      <div><canvas id="chart-monthly"></canvas></div>
      <div><canvas id="chart-dest"></canvas></div>
    </div>

    <table>
      <thead>
        <tr><th>Rep</th><th>Today Sales</th><th>Today Rev</th><th>MTD Sales</th><th>MTD Rev</th></tr>
      </thead>
      <tbody id="leaderboard-tbody"></tbody>
    </table>
  </main>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
